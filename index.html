<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SBF Price Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue-900:#00345d; --blue-800:#00457c; --blue-600:#00579b;
  --blue-400:#3f81b4; --blue-200:#8cb3d2; --blue-100:#bfd5e6; --blue-50:#e5eef5;
  --red-900:#86121b;  --red-800:#b31824;  --red-600:#e01e2d;
  --red-400:#e75661;  --red-200:#f199a0;  --red-100:#f7c6ca;  --red-50:#fbe8ea;
  --green-600:#1d9e75; --green-400:#3dbf96; --green-200:#82d9be; --green-100:#b8ecdc;
  --bg:#1a1a1a; --surface:#242424; --surface2:#2e2e2e; --surface3:#383838;
  --border:rgba(255,255,255,0.1); --border-hi:rgba(255,255,255,0.25);
  --text:#e8f0f7; --muted:#8a8a9a; --muted2:#555568;
  --font-head:'Barlow',sans-serif; --font-mono:'Roboto Mono',monospace;
  --r:10px; --rl:16px;
}
body {
  background:var(--bg); color:var(--text); font-family:var(--font-head);
  min-height:100vh; display:flex; align-items:flex-start;
  justify-content:center; padding:2.5rem 2rem 3rem;
}
.shell { width:100%; max-width:960px; display:flex; flex-direction:column; gap:18px; }

/* Logo */
.logo-bar {
  display:flex; align-items:center; justify-content:center;
  padding:20px 32px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--rl);
}
.logo-bar img { height:149px; width:auto; max-width:100%; filter:brightness(0) invert(1); }

/* Mode toggle */
.mode-toggle {
  display:grid; grid-template-columns:1fr 1fr;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--rl); padding:6px; gap:6px;
}
.mode-btn {
  display:flex; align-items:center; justify-content:center; gap:9px;
  padding:13px 16px; border-radius:11px; border:none; background:transparent;
  color:var(--muted); font-family:var(--font-head); font-size:15px;
  font-weight:700; letter-spacing:0.02em; text-transform:uppercase;
  cursor:pointer; transition:background 0.18s,color 0.18s,box-shadow 0.18s;
}
.mode-btn i { font-size:18px; }
.mode-btn.active-a { background:rgba(255,255,255,0.1); color:var(--text); box-shadow:inset 0 0 0 1px rgba(255,255,255,0.2); }
.mode-btn.active-b { background:rgba(255,255,255,0.1); color:var(--text); box-shadow:inset 0 0 0 1px rgba(255,255,255,0.2); }

/* Two-column grid */
.main-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; }

/* Input card */
.card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--rl); padding:2rem;
  display:flex; flex-direction:column; gap:1.4rem;
}
.card-header { display:flex; flex-direction:column; gap:4px; }
.card-header h1 { font-size:22px; font-weight:800; letter-spacing:-0.01em; color:var(--text); }
.card-header p  { font-size:13px; font-family:var(--font-mono); color:var(--muted); }
.rate-badge {
  display:inline-flex; align-items:center; gap:6px;
  font-size:12px; font-family:var(--font-mono);
  padding:4px 12px; border-radius:20px; margin-top:8px; width:fit-content;
}
.rate-badge.mode-a { background:rgba(0,87,155,0.18); color:var(--blue-100); border:1px solid rgba(0,87,155,0.35); }
.rate-badge.mode-b { background:rgba(224,30,45,0.14); color:var(--red-200);  border:1px solid rgba(224,30,45,0.3);  }
.divider { height:1px; background:var(--border); }
.field { display:flex; flex-direction:column; gap:8px; }
.field label { font-size:12px; font-family:var(--font-mono); letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); }
.input-wrap { position:relative; display:flex; align-items:center; }
.input-wrap .pfx {
  position:absolute; left:16px;
  font-family:var(--font-mono); font-size:20px; color:var(--muted);
  pointer-events:none; user-select:none;
}
input[type="number"] {
  width:100%; background:var(--surface2); border:1px solid var(--border);
  border-radius:var(--r); color:var(--text);
  font-family:var(--font-mono); font-size:26px; font-weight:500;
  padding:16px 18px 16px 40px; outline:none;
  transition:border-color 0.15s,box-shadow 0.15s;
  -moz-appearance:textfield; appearance:textfield;
}
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance:none; }
input.focus-a:focus { border-color:var(--blue-600); box-shadow:0 0 0 3px rgba(0,87,155,0.2); }
input.focus-b:focus { border-color:var(--red-600);  box-shadow:0 0 0 3px rgba(224,30,45,0.18); }
.calc-btn {
  width:100%; border:none; border-radius:var(--r); color:#fff;
  font-family:var(--font-head); font-size:16px; font-weight:800;
  letter-spacing:0.06em; text-transform:uppercase; padding:17px;
  cursor:pointer; transition:opacity 0.15s,transform 0.1s;
}
.calc-btn:hover  { opacity:0.88; }
.calc-btn:active { transform:scale(0.98); }
.calc-btn.btn-a  { background:var(--blue-600); }
.calc-btn.btn-b  { background:var(--red-800);  }
.err { font-family:var(--font-mono); font-size:13px; color:var(--red-400); min-height:16px; text-align:center; }

/* Results column */
.results-empty {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--rl);
  padding:2rem; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:14px; min-height:300px;
}
.results-empty.hidden { display:none; }
.results-empty i { font-size:44px; color:var(--muted2); }
.results-empty p { font-size:13px; font-family:var(--font-mono); color:var(--muted2); text-align:center; line-height:1.7; }

.results-panel {
  background:var(--surface); border:1px solid var(--border); border-radius:var(--rl);
  padding:2rem; flex-direction:column; gap:1rem;
  opacity:0; transform:translateY(8px);
  transition:opacity 0.22s ease,transform 0.22s ease;
  pointer-events:none; display:none;
}
.results-panel.show { display:flex; opacity:1; transform:translateY(0); pointer-events:auto; }
.results-panel h2 {
  font-size:12px; font-family:var(--font-mono); letter-spacing:0.08em;
  text-transform:uppercase; color:var(--muted); font-weight:400;
}
.row {
  display:flex; align-items:center; justify-content:space-between;
  background:var(--surface2); border:1px solid var(--border);
  border-radius:var(--r); padding:15px 20px;
}
.row .lbl {
  font-size:12px; font-family:var(--font-mono); letter-spacing:0.07em;
  text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:7px;
}
.row .lbl i { font-size:15px; }
.row .val { font-family:var(--font-mono); font-size:21px; font-weight:500; color:var(--text); }
.row.markup .val  { color:var(--green-400); }
.row.total-a      { border-color:rgba(29,158,117,0.55); border-width:1.5px; }
.row.total-a .val { color:var(--green-200); font-size:28px; }
.row.deduct .val  { color:var(--red-400); }
.row.total-b      { border-color:rgba(29,158,117,0.55); border-width:1.5px; }
.row.total-b .val { color:var(--green-200); font-size:28px; }
.round-note { font-size:12px; font-family:var(--font-mono); color:var(--muted2); text-align:right; padding:0 2px; display:none; }
.reset-btn {
  background:none; border:1px solid var(--border); border-radius:var(--r);
  color:var(--muted); font-family:var(--font-mono); font-size:12px;
  letter-spacing:0.07em; text-transform:uppercase; padding:11px;
  cursor:pointer; width:100%; transition:border-color 0.15s,color 0.15s; margin-top:4px;
}
.reset-btn:hover { border-color:var(--border-hi); color:var(--text); }
.footer { text-align:center; font-family:var(--font-mono); font-size:11px; color:var(--muted2); letter-spacing:0.05em; padding-bottom:0.5rem; }
</style>
</head>

  </div>

  <div class="mode-toggle">
    <button class="mode-btn active-b" id="btnModeB" onclick="setMode('b')">
      <i class="ti ti-trending-down" aria-hidden="true"></i> Cost Deduction
    </button>
    <button class="mode-btn" id="btnModeA" onclick="setMode('a')">
      <i class="ti ti-trending-up" aria-hidden="true"></i> Pricing Helper
    </button>
  </div>

  <div class="main-grid">

    <div class="card">
      <div class="card-header">
        <h1 id="cardTitle">Cost Deduction</h1>
        <p id="cardDesc">subtract 3.84% from any amount</p>
        <span class="rate-badge mode-b" id="rateBadge">
          <i class="ti ti-minus" aria-hidden="true"></i> 3.84% deducted
        </span>
      </div>
      <div class="divider"></div>
      <div class="field">
        <label id="inputLabel">Input amount</label>
        <div class="input-wrap">
          <span class="pfx">$</span>
          <input type="number" id="mainInput" class="focus-b"
                 placeholder="0.00" min="0" step="0.01" inputmode="decimal" />
        </div>
      </div>
      <div class="err" id="errMsg"></div>
      <button class="calc-btn btn-b" id="calcBtn" onclick="calculate()">Calculate</button>
    </div>

    <div>
      <div class="results-empty" id="resultsEmpty">
        <i class="ti ti-calculator" aria-hidden="true"></i>
        <p>Enter a value and press<br>Calculate to see results</p>
      </div>
      <div class="results-panel" id="resultsPanel">
        <h2>Results</h2>
        <div class="row">
          <span class="lbl"><i class="ti ti-receipt" aria-hidden="true"></i>Input price</span>
          <span class="val" id="valInput">—</span>
        </div>
        <div class="row deduct" id="rowChange">
          <span class="lbl" id="changeLabel"><i class="ti ti-arrow-down-right" aria-hidden="true"></i>Deduction amount</span>
          <span class="val" id="valChange">—</span>
        </div>
        <div class="round-note" id="roundNote">
          pre-round: <span id="preRoundVal">—</span> &rarr; rounded to nearest .50 / .99
        </div>
        <div class="row total-b" id="rowTotal">
          <span class="lbl"><i class="ti ti-tag" aria-hidden="true"></i>Total price</span>
          <span class="val" id="valTotal">—</span>
        </div>
        <button class="reset-btn" onclick="reset()">reset</button>
      </div>
    </div>

  </div>

  <div class="footer">3.84% rate &nbsp;&bull;&nbsp; SBF Price Calculator</div>

</div>
<script>
  const RATE = 3.84;
  let mode = 'b';

  const mainInput    = document.getElementById('mainInput');
  const calcBtn      = document.getElementById('calcBtn');
  const resultsPanel = document.getElementById('resultsPanel');
  const resultsEmpty = document.getElementById('resultsEmpty');
  const errMsg       = document.getElementById('errMsg');
  const btnModeA     = document.getElementById('btnModeA');
  const btnModeB     = document.getElementById('btnModeB');
  const cardTitle    = document.getElementById('cardTitle');
  const cardDesc     = document.getElementById('cardDesc');
  const rateBadge    = document.getElementById('rateBadge');
  const inputLabel   = document.getElementById('inputLabel');
  const changeLabel  = document.getElementById('changeLabel');
  const rowChange    = document.getElementById('rowChange');
  const rowTotal     = document.getElementById('rowTotal');
  const roundNote    = document.getElementById('roundNote');
  const preRoundVal  = document.getElementById('preRoundVal');
  const valInput     = document.getElementById('valInput');
  const valChange    = document.getElementById('valChange');
  const valTotal     = document.getElementById('valTotal');

  function fmt(n) {
    return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function roundToNearestCents(value) {
    const floor = Math.floor(value);
    const cents = value - floor;
    return floor + (Math.abs(cents - 0.50) <= Math.abs(cents - 0.99) ? 0.50 : 0.99);
  }

  function setMode(m) {
    mode = m;
    reset(true);
    if (m === 'a') {
      btnModeA.className = 'mode-btn active-b';
      btnModeB.className = 'mode-btn';
      cardTitle.textContent  = 'Pricing Helper';
      cardDesc.textContent   = 'mark up your cost to a retail price';
      rateBadge.className    = 'rate-badge mode-a';
      rateBadge.innerHTML    = '<i class="ti ti-plus" aria-hidden="true"></i> 3.84% markup &middot; rounded to .50 or .99';
      inputLabel.textContent = 'Cost / input price';
      changeLabel.innerHTML  = '<i class="ti ti-arrow-up-right" aria-hidden="true"></i>Markup amount';
      rowChange.className    = 'row markup';
      rowTotal.className     = 'row total-a';
      calcBtn.className      = 'calc-btn btn-a';
      mainInput.className    = 'focus-a';
    } else {
      btnModeB.className = 'mode-btn active-b';
      btnModeA.className = 'mode-btn';
      cardTitle.textContent  = 'Cost Deduction';
      cardDesc.textContent   = 'subtract 3.84% from any amount';
      rateBadge.className    = 'rate-badge mode-b';
      rateBadge.innerHTML    = '<i class="ti ti-minus" aria-hidden="true"></i> 3.84% deducted';
      inputLabel.textContent = 'Input amount';
      changeLabel.innerHTML  = '<i class="ti ti-arrow-down-right" aria-hidden="true"></i>Deduction amount';
      rowChange.className    = 'row deduct';
      rowTotal.className     = 'row total-b';
      calcBtn.className      = 'calc-btn btn-b';
      mainInput.className    = 'focus-b';
    }
    mainInput.focus();
  }

  function calculate() {
    errMsg.textContent = '';
    const raw = parseFloat(mainInput.value);
    if (isNaN(raw) || raw < 0) { errMsg.textContent = 'Please enter a valid positive number.'; return; }
    const delta = raw * (RATE / 100);
    if (mode === 'a') {
      const preRound = raw + delta;
      const total    = roundToNearestCents(preRound);
      valInput.textContent    = fmt(raw);
      valChange.textContent   = '+ ' + fmt(delta);
      preRoundVal.textContent = fmt(preRound);
      roundNote.style.display = 'block';
      valTotal.textContent    = fmt(total);
    } else {
      valInput.textContent    = fmt(raw);
      valChange.textContent   = '− ' + fmt(delta);
      roundNote.style.display = 'none';
      valTotal.textContent    = fmt(raw - delta);
    }
    resultsPanel.classList.add('show');
    resultsEmpty.classList.add('hidden');
  }

  function reset(silent) {
    mainInput.value = '';
    errMsg.textContent = '';
    resultsPanel.classList.remove('show');
    resultsEmpty.classList.remove('hidden');
    roundNote.style.display = 'none';
    if (!silent) mainInput.focus();
  }

  mainInput.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
</script>
</body>
</html>
